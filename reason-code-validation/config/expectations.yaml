# Fixture manifest for the reason-code validation suite.
#
# Each fixture pairs one gameplay-log dump with, per progress point, the reason
# code(s) the CURRENT Corresponding Scripts are expected to trigger and the
# message variables they are expected to return. `run_all.py` (and each
# `rc_uXpY.py` run standalone) executes the scripts against the fixture log
# and compares against `expected`.
#
# Per point:
#   codes:      list of expected TRIGGERED codes ([] = no pop-up: green cell,
#               or a not-reached point with no attempt window).
#   variables:  optional, {CODE: {variable: value}} — only listed variables
#               are compared; values must match exactly (numbers or strings).
#
# All 26 points must be present (the runner exits listing any missing one).
# Log paths are relative to the repository root — the same dumps the
# rubric-validation fixtures use; nothing is copied.
#
# Adding a fixture for a new build:
#   1. Run `python run_all.py --log <dump>` (ad-hoc): the structural checks
#      (pop-up <-> cell consistency, message placeholders) already pass/fail.
#   2. Establish the expected codes + variables INDEPENDENTLY — from the
#      tester's declared intent for the playthrough and/or raw event-key
#      counts in the window — never by copying the ad-hoc output back in.
#   3. Add an entry mirroring the ones below and record the source in
#      `provenance`.

